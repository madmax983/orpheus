[workspace]
members = [
    "crates/orpheus-dsp",
    "crates/orpheus-lang",
    "crates/orpheus-pattern",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
cpal = "0.15"
comfy-table = "7.1.3"
crossterm = "0.29"
flacenc = "0.5"
hound = "3.5"
midir = "0.10"
orpheus-dsp = { path = "crates/orpheus-dsp" }
orpheus-lang = { path = "crates/orpheus-lang" }
orpheus-pattern = { path = "crates/orpheus-pattern" }
proptest = "1.6.0"
ratatui = "0.30"
ratatui-hypertile = "0.3"
ratatui-hypertile-extras = { version = "0.3", features = ["crossterm"] }
rosc = "0.11"
rtrb = "0.3"
thiserror = "2"
loom = "0.7"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
nursery = "warn"
pedantic = "warn"

[package]
name = "orpheus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
comfy-table = "7.2.2"
cpal.workspace = true
crossterm.workspace = true
orpheus-dsp.workspace = true
orpheus-lang = { version = "0.1.0", path = "crates/orpheus-lang" }
orpheus-pattern = { version = "0.1.0", path = "crates/orpheus-pattern" }

[dev-dependencies]
assert_cmd = "2"
hound.workspace = true
orpheus-pattern.workspace = true
predicates = "3"
